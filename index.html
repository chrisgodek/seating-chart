<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seating Chart</title>
<style>
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --border: #dbe0e6;
  --text: #1f2430;
  --text-muted: #6b7280;
  --accent: #3b6fe0;
  --accent-hover: #2f5bc4;
  --accent-soft: #e8effd;
  --danger: #d9483b;
  --danger-soft: #fbe9e7;
  --success: #2f9e5b;
  --front-badge: #f0a020;
  --warning: #c9962c;
  --warning-soft: #fbf1de;
  --suit-red: #c0392b;
  --seat-empty: #eef1f5;
  --seat-filled: #ffffff;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161c;
    --panel: #1d2028;
    --border: #2c313c;
    --text: #e7e9ee;
    --text-muted: #9aa1ac;
    --accent: #5b8cf0;
    --accent-hover: #6f9bff;
    --accent-soft: #223050;
    --danger: #ef6a5c;
    --danger-soft: #3a2220;
    --success: #4ec27f;
    --front-badge: #d99a2b;
    --warning: #d9ab3f;
    --warning-soft: #3a3120;
    --suit-red: #e0685a;
    --seat-empty: #262a34;
    --seat-filled: #232734;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.4);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

#app {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}

h1, h2, h3, h4 { margin: 0 0 8px; }

button {
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 6px 12px;
  transition: background 0.12s, border-color 0.12s;
}
button:hover { border-color: var(--accent); }
button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
button.primary:hover { background: var(--accent-hover); }
button.danger {
  color: var(--danger);
  border-color: var(--danger);
  background: transparent;
}
button.danger:hover { background: var(--danger-soft); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.small { padding: 3px 8px; font-size: 12px; }

input[type="text"], input[type="number"], select {
  font-family: inherit;
  font-size: 13px;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
}
input[type="checkbox"] { accent-color: var(--accent); }
input:disabled { opacity: 0.45; cursor: not-allowed; }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}

.header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.period-tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.period-tab {
  padding: 7px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--panel);
  cursor: pointer;
  font-size: 13px;
  color: var(--text-muted);
}
.period-tab.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.period-tab-label-input {
  width: 90px;
}

.main-grid {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 16px;
  align-items: start;
}

@media (max-width: 900px) {
  .main-grid { grid-template-columns: 1fr; }
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.section-title {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 10px;
}

.roster-list {
  max-height: 320px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
}
.roster-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.roster-row:last-child { border-bottom: none; }
.roster-row.selected { background: var(--accent-soft); }
.roster-row .name { flex: 1; }
.roster-row .front-badge {
  font-size: 10px;
  background: var(--front-badge);
  color: white;
  padding: 1px 6px;
  border-radius: 10px;
}
.roster-row button.row-delete { visibility: hidden; }
.roster-row:hover button.row-delete { visibility: visible; }
.roster-row .phone-input { width: 46px; padding: 3px 6px; font-size: 11px; }

.toolbar-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.hint {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 6px;
}

.constraint-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
}
.constraint-chip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  padding: 5px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.constraint-chip.avoid { background: var(--danger-soft); }
.constraint-chip.must { background: var(--accent-soft); }

.layout-config-row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--text-muted);
}
.field input { width: 70px; }
.field select { width: 130px; }

.room-grid {
  display: grid;
  gap: 14px;
  padding: 16px;
  background: var(--bg);
  border: 1px dashed var(--border);
  border-radius: 8px;
}

.table-group {
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  padding: 8px;
  min-height: 90px;
  position: relative;
}
.table-group.front { border-color: var(--front-badge); }
.table-group.thin { border-color: var(--warning); border-style: dashed; }
.table-group.blank { border: none; background: transparent; box-shadow: none; min-height: 0; }
.table-group.empty-slot {
  border-style: dashed;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  background: transparent;
}
.table-group .table-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.table-group .front-tag {
  color: var(--front-badge);
  font-weight: 600;
}
.table-group .thin-tag {
  color: var(--warning);
  font-weight: 600;
  font-size: 10px;
}
.table-group .table-controls {
  display: flex;
  gap: 4px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.table-group .table-controls input[type="number"] {
  width: 44px;
  padding: 2px 4px;
}

.seat-grid {
  display: grid;
  gap: 5px;
}
.seat {
  min-width: 0;
  min-height: 48px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--seat-empty);
  font-size: 11px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 6px 4px 4px;
  cursor: grab;
  user-select: none;
  position: relative;
  touch-action: none;
}
.seat.filled {
  background: var(--seat-filled);
  border-color: var(--accent);
  font-weight: 500;
}
.suit-badge {
  position: absolute;
  top: 3px;
  right: 5px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
  color: var(--text);
}
.suit-badge.red { color: var(--suit-red); }
.seat-name { padding-right: 14px; }
.seat-phone {
  font-size: 9px;
  color: var(--text-muted);
  margin-top: 2px;
}
.seat.conflict {
  border-color: var(--danger);
  background: var(--danger-soft);
  box-shadow: 0 0 0 1px var(--danger);
}
.seat.drag-over {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.seat.dragging { opacity: 0.4; }

.saved-chart-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 6px;
  font-size: 12px;
}
.saved-chart-row .name-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
}
.saved-chart-row .timestamps {
  color: var(--text-muted);
  font-size: 11px;
}
.saved-chart-row .actions {
  display: flex;
  gap: 6px;
  margin-top: 4px;
}

.warning-banner {
  background: var(--danger-soft);
  color: var(--danger);
  border: 1px solid var(--danger);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 12px;
  margin-bottom: 12px;
}

.empty-state {
  color: var(--text-muted);
  font-size: 13px;
  padding: 20px;
  text-align: center;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}

.legend {
  display: flex;
  gap: 14px;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 10px;
  flex-wrap: wrap;
}
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.print-header { display: none; }

@media print {
  :root {
    --text: #000 !important;
    --text-muted: #333 !important;
    --border: #999 !important;
    --seat-empty: #fff !important;
    --seat-filled: #fff !important;
    --panel: #fff !important;
    --danger: #a00 !important;
    --danger-soft: #fdeceb !important;
    --suit-red: #a00 !important;
    --warning: #8a6200 !important;
    --warning-soft: #fdf3dc !important;
    --front-badge: #b5750a !important;
  }
  body { background: #fff !important; }
  /* Hide everything except the seating chart itself. Using display:none (not
     visibility:hidden) so hidden content doesn't still reserve page space and
     push out a blank second page. */
  .header-bar, .period-tabs, .sidebar-info, .layout-panel { display: none !important; }
  #app { max-width: none; margin: 0; padding: 0; }
  .main-grid { display: block; }
  .sidebar-room { display: block; }
  .seating-chart-panel {
    border: none;
    box-shadow: none;
    padding: 0;
  }
  .seating-chart-panel .section-title,
  .seating-chart-panel .toolbar-row,
  .seating-chart-panel .warning-banner,
  .seating-chart-panel .legend {
    display: none !important;
  }
  .print-header {
    display: block;
    text-align: center;
    margin-bottom: 18px;
  }
  .print-header-banner {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.02em;
    border-bottom: 3px solid #000;
    padding-bottom: 10px;
  }
  .print-header-sub {
    margin-top: 8px;
    font-size: 20px;
    font-weight: 700;
    color: #000;
  }
  .table-group, .seat { border-color: #000 !important; }
  .table-group.thin { border-style: solid !important; }
  .thin-tag { display: none !important; }
  .front-word { display: none !important; }
  .seat.conflict {
    border-color: #000 !important;
    background: #fff !important;
    box-shadow: none !important;
  }
  .table-group.blank { border: none !important; }
  .room-grid { background: none !important; border: none !important; }
}

</style>
</head>
<body>
<div id="app"></div>

<script>
// ---- js/util.js ----
window.App = window.App || {};

(function () {
  function fullName(student) {
    return [student.firstName, student.lastName].filter(Boolean).join(" ").trim();
  }

  function formatTimestamp(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) +
      " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  const SUITS = {
    spade: { symbol: "♠", color: "dark", label: "Spades" },
    heart: { symbol: "♥", color: "red", label: "Hearts" },
    diamond: { symbol: "♦", color: "red", label: "Diamonds" },
    club: { symbol: "♣", color: "dark", label: "Clubs" },
  };

  // Table display numbers ("Table 1", "Table 2"...), assigned front-to-back,
  // left-to-right by grid position so they stay stable as tables are edited.
  function numberTables(layout) {
    const sorted = layout.groups.slice().sort((a, b) => (a.row - b.row) || (a.col - b.col));
    const numbers = {};
    sorted.forEach((g, i) => { numbers[g.id] = i + 1; });
    return numbers;
  }

  // Which suit belongs at a given seat index within a table (reading order:
  // top-left, top-right, bottom-left, bottom-right for a 2x2 table). The
  // 4-entry pattern repeats for tables with more than 4 seats.
  function suitForSeatIndex(period, index) {
    const pattern = period.suitPattern && period.suitPattern.length ? period.suitPattern : ["spade", "heart", "diamond", "club"];
    return pattern[index % pattern.length];
  }

  // Auto-assigned phone hotel numbers: Table 1's seats get #1..N, Table 2
  // continues where Table 1 left off, and so on — tied to the seat/table, not
  // whichever student happens to sit there, so it stays correct across reshuffles.
  function computeAutoPhoneNumbers(layout) {
    const sorted = layout.groups.slice().sort((a, b) => (a.row - b.row) || (a.col - b.col));
    const numbers = {};
    let counter = 1;
    sorted.forEach((g) => {
      const capacity = App.seating.groupCapacity(g);
      for (let i = 0; i < capacity; i++) {
        numbers[App.seating.seatId(g.id, i)] = counter++;
      }
    });
    return numbers;
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    attrs = attrs || {};
    for (const key in attrs) {
      const val = attrs[key];
      if (val === undefined || val === null || val === false) continue;
      if (key === "class") node.className = val;
      else if (key === "text") node.textContent = val;
      else if (key === "html") node.innerHTML = val;
      else if (key.startsWith("on") && typeof val === "function") {
        node.addEventListener(key.slice(2).toLowerCase(), val);
      } else if (key in node) {
        try { node[key] = val; } catch (e) { node.setAttribute(key, val); }
      } else {
        node.setAttribute(key, val);
      }
    }
    (children || []).forEach((c) => {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  App.util = { fullName, formatTimestamp, el, SUITS, numberTables, suitForSeatIndex, computeAutoPhoneNumbers };
})();

// ---- js/store.js ----
// Global app namespace + persisted state store (localStorage-backed, pub/sub).
window.App = window.App || {};

(function () {
  const STORAGE_KEY = "seatingChart.v1";

  function uid(prefix) {
    const rand = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
    return (prefix ? prefix + "-" : "") + rand;
  }

  function makeEmptyPeriod(index) {
    return {
      id: uid("period"),
      label: "Period " + index,
      students: [],
      avoidPairs: [],
      mustPairs: [],
      layout: { rows: 0, cols: 0, groups: [] },
      preferredPerTable: 4,
      preferredMinPerTable: 2,
      suitPattern: ["spade", "heart", "diamond", "club"],
      autoAssignPhoneNumbers: false,
      assignment: {}, // seatId -> studentId
      savedCharts: [], // { id, name, layout, assignment, createdAt, lastUsedAt }
    };
  }

  function defaultState() {
    const periods = {};
    const order = [];
    for (let i = 1; i <= 5; i++) {
      const p = makeEmptyPeriod(i);
      periods[p.id] = p;
      order.push(p.id);
    }
    return { periodOrder: order, periods, activePeriodId: order[0] };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      if (!parsed || !parsed.periods || !parsed.periodOrder) return defaultState();
      return parsed;
    } catch (e) {
      console.error("Failed to load saved data, starting fresh.", e);
      return defaultState();
    }
  }

  const state = load();
  const listeners = [];

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error("Failed to save data to localStorage.", e);
    }
  }

  function notify() {
    for (const fn of listeners) fn(state);
  }

  const store = {
    state,
    uid,
    subscribe(fn) {
      listeners.push(fn);
      return () => {
        const idx = listeners.indexOf(fn);
        if (idx >= 0) listeners.splice(idx, 1);
      };
    },
    // Run a mutator against the live state, then persist + notify.
    update(mutator) {
      mutator(state);
      persist();
      notify();
    },
    getActivePeriod() {
      return state.periods[state.activePeriodId];
    },
  };

  App.store = store;
})();

// ---- js/csv.js ----
window.App = window.App || {};

(function () {
  // RFC4180-ish CSV parser: handles quoted fields, embedded commas, escaped quotes.
  function parseCSV(text) {
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else {
          field += c;
        }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ",") {
        row.push(field);
        field = "";
      } else if (c === "\n") {
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
      } else if (c === "\r") {
        // skip, \n handles the line break
      } else {
        field += c;
      }
    }
    if (field.length || row.length) {
      row.push(field);
      rows.push(row);
    }
    return rows.filter((r) => r.some((f) => f.trim() !== ""));
  }

  // Splits a single "full name" cell into {firstName, lastName}. Handles both
  // "Last, First" and "First Last" notations.
  function parseFullName(full) {
    full = (full || "").trim();
    if (!full) return { firstName: "", lastName: "" };
    if (full.includes(",")) {
      const parts = full.split(",");
      return { lastName: parts[0].trim(), firstName: (parts[1] || "").trim() };
    }
    const idx = full.indexOf(" ");
    if (idx === -1) return { firstName: full, lastName: "" };
    return { firstName: full.slice(0, idx).trim(), lastName: full.slice(idx + 1).trim() };
  }

  // Converts spreadsheet-style rows (array of arrays of strings) into
  // [{firstName, lastName}]. Supports headers like "First Name"/"Last Name",
  // a single "Name" column ("First Last" or "Last, First"), or falls back to
  // treating the first column as a full name with no header. Shared by the
  // CSV and Excel parsers so both formats behave identically.
  function rowsToStudents(rows) {
    if (!rows.length) return [];

    const headerRow = rows[0];
    const looksLikeHeader = headerRow.some((h) => /name/i.test(h));
    const dataRows = looksLikeHeader ? rows.slice(1) : rows;

    let firstIdx = -1, lastIdx = -1, fullIdx = -1;
    if (looksLikeHeader) {
      headerRow.forEach((h, i) => {
        const t = (h || "").trim().toLowerCase();
        if (/^first/.test(t)) firstIdx = i;
        else if (/^last/.test(t)) lastIdx = i;
        else if (fullIdx === -1 && /name/.test(t)) fullIdx = i;
      });
    }
    if (firstIdx === -1 && lastIdx === -1 && fullIdx === -1) fullIdx = 0;

    const students = [];
    for (const r of dataRows) {
      let firstName = "", lastName = "";
      if (firstIdx >= 0 || lastIdx >= 0) {
        firstName = (firstIdx >= 0 ? r[firstIdx] || "" : "").trim();
        lastName = (lastIdx >= 0 ? r[lastIdx] || "" : "").trim();
      } else {
        const parsed = parseFullName(r[fullIdx]);
        firstName = parsed.firstName;
        lastName = parsed.lastName;
      }
      if (!firstName && !lastName) continue;
      students.push({ firstName, lastName });
    }
    return students;
  }

  // Parses roster CSV text into [{firstName, lastName}].
  function parseRoster(text) {
    return rowsToStudents(parseCSV(text));
  }

  // Parses a plain-text roster, one name per line ("First Last" or "Last, First").
  function parseTextRoster(text) {
    return text
      .split(/\r\n|\r|\n/)
      .map((line) => line.trim())
      .filter(Boolean)
      .map((line) => parseFullName(line))
      .filter((s) => s.firstName || s.lastName);
  }

  // Reads the first sheet of a SheetJS workbook into [{firstName, lastName}].
  function parseWorkbookRoster(workbook) {
    const sheetName = workbook.SheetNames[0];
    if (!sheetName) return [];
    const sheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" })
      .map((row) => row.map((cell) => (cell == null ? "" : String(cell))));
    return rowsToStudents(rows);
  }

  App.csv = { parseCSV, parseRoster, parseTextRoster, parseWorkbookRoster };
})();

// ---- js/seating.js ----
window.App = window.App || {};

(function () {
  function seatId(groupId, index) {
    return groupId + ":" + index;
  }

  function groupCapacity(g) {
    return g.seatRows * g.seatCols;
  }

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildClusters(students, mustPairs) {
    const parent = {};
    students.forEach((s) => { parent[s.id] = s.id; });
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function union(a, b) { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }
    const studentIds = new Set(students.map((s) => s.id));
    (mustPairs || []).forEach(([a, b]) => {
      if (studentIds.has(a) && studentIds.has(b)) union(a, b);
    });
    const groups = {};
    students.forEach((s) => {
      const root = find(s.id);
      (groups[root] = groups[root] || []).push(s);
    });
    return Object.values(groups).map((members) => ({
      id: "cluster-" + members[0].id,
      members,
      isFront: members.some((m) => m.front),
      size: members.length,
    }));
  }

  // Splits `totalSize` people across the fewest tables possible (front-to-back
  // order), as evenly as possible, so seating can aim for each used table to
  // land on or near the preferred minimum instead of packing one table full
  // and leaving a thin leftover. Returns {groupId: targetHeadcount}.
  function computeTargets(tables, totalSize, preferredMax) {
    const targets = {};
    if (!tables.length) return targets;
    if (totalSize <= 0) { tables.forEach((t) => { targets[t.id] = 0; }); return targets; }
    const k = Math.max(1, Math.min(tables.length, Math.ceil(totalSize / preferredMax)));
    const base = Math.floor(totalSize / k);
    const extra = totalSize % k;
    tables.forEach((t, i) => { targets[t.id] = i < k ? base + (i < extra ? 1 : 0) : 0; });
    return targets;
  }

  // Places clusters into groups from `groupPool` (each {id, row, capacity}).
  // Candidates are ordered front-row-first (so a row fills before the next one
  // opens — "auto-populate from the front"), then by which table is furthest
  // below its fair-share `target` (so students spread evenly toward the
  // preferred minimum instead of maxing out one table before the next), with
  // random jitter to break ties so seating still varies between randomizations.
  // Prefers a candidate that avoids co-locating an "avoid pair". Mutates
  // `remainingCap` and `occupancy` (groupId -> studentId[]); returns unplaced clusters.
  function placeClusters(clusters, groupPool, occupancy, remainingCap, avoidSet, violations, targets) {
    const unplaced = [];
    for (const cluster of shuffled(clusters)) {
      const candidates = groupPool
        .filter((g) => remainingCap[g.id] >= cluster.size)
        .map((g) => ({ g, jitter: Math.random() }))
        .sort((a, b) => {
          if (a.g.row !== b.g.row) return a.g.row - b.g.row;
          const deficitA = (targets[a.g.id] || 0) - (a.g.capacity - remainingCap[a.g.id]);
          const deficitB = (targets[b.g.id] || 0) - (b.g.capacity - remainingCap[b.g.id]);
          if (deficitA !== deficitB) return deficitB - deficitA;
          // Deficit is tied — let randomness (not "which table already has more people")
          // decide, so e.g. front-priority students actually spread across front tables
          // instead of always stacking into whichever one got the first pick.
          return a.jitter - b.jitter;
        })
        .map((x) => x.g);
      if (!candidates.length) { unplaced.push(cluster); continue; }
      // Prefer a candidate group with no existing occupant on this cluster's avoid-list.
      let chosen = candidates.find((g) => {
        const occupants = occupancy[g.id] || [];
        return !occupants.some((occId) =>
          cluster.members.some((m) => avoidSet.has(m.id + "|" + occId) || avoidSet.has(occId + "|" + m.id))
        );
      });
      if (!chosen) chosen = candidates[0];
      occupancy[chosen.id] = (occupancy[chosen.id] || []).concat(cluster.members.map((m) => m.id));
      remainingCap[chosen.id] -= cluster.size;
      // Count any avoid-pair violations created by this placement.
      const occupants = (occupancy[chosen.id] || []).slice(0, -cluster.size);
      cluster.members.forEach((m) => {
        occupants.forEach((occId) => {
          if (avoidSet.has(m.id + "|" + occId) || avoidSet.has(occId + "|" + m.id)) violations.push([m.id, occId]);
        });
      });
    }
    return unplaced;
  }

  // Runs one full randomized placement attempt; returns { occupancy, score, unplacedIds, frontOverflowCount }.
  function attempt(students, layout, avoidPairs, mustPairs, preferredMax, preferredMin) {
    const clusters = buildClusters(students, mustPairs);
    const frontClusters = clusters.filter((c) => c.isFront);
    const normalClusters = clusters.filter((c) => !c.isFront);

    // Front-flagged tables — only front-priority students are restricted to this pool.
    const frontGroups = layout.groups.filter((g) => g.isFront)
      .map((g) => ({ id: g.id, row: g.row, capacity: Math.min(groupCapacity(g), preferredMax) }))
      .sort((a, b) => a.row - b.row);
    // Every table, front and normal — everyone else (and front overflow) can use any of these,
    // so a front table with more seats than front-priority students still ends up full.
    const allGroups = layout.groups
      .map((g) => ({ id: g.id, row: g.row, capacity: Math.min(groupCapacity(g), preferredMax) }))
      .sort((a, b) => a.row - b.row);

    const totalSize = frontClusters.reduce((n, c) => n + c.size, 0) + normalClusters.reduce((n, c) => n + c.size, 0);
    const targets = computeTargets(allGroups, totalSize, preferredMax);

    const remainingCap = {};
    allGroups.forEach((g) => { remainingCap[g.id] = g.capacity; });
    const occupancy = {};
    const avoidSet = new Set();
    (avoidPairs || []).forEach(([a, b]) => avoidSet.add(a + "|" + b));

    const violations = [];
    // Front-priority students go into front tables first, spread across whichever front
    // tables need them most (targets are shared room-wide, so this still favors the
    // frontmost tables) rather than stacking every front-priority student into one table.
    let unplacedFront = placeClusters(frontClusters, frontGroups, occupancy, remainingCap, avoidSet, violations, targets);
    // If front tables genuinely can't hold every front-priority student, the rest spill anywhere.
    let overflowUnplaced = placeClusters(unplacedFront, allGroups, occupancy, remainingCap, avoidSet, violations, targets);
    // Everyone else fills whatever's left, front tables included — this is what auto-fills
    // front seats a front-priority student didn't need with regular students instead of
    // leaving them empty.
    let unplacedNormal = placeClusters(normalClusters, allGroups, occupancy, remainingCap, avoidSet, violations, targets);

    const unplacedClusters = overflowUnplaced.concat(unplacedNormal);
    const unplacedIds = [];
    unplacedClusters.forEach((c) => c.members.forEach((m) => unplacedIds.push(m.id)));

    // Tables left with a nonzero but below-preferred-minimum headcount are penalized
    // so the randomized search favors solidly-filled tables over thinly-spread ones.
    let thinPenalty = 0;
    layout.groups.forEach((g) => {
      const count = (occupancy[g.id] || []).length;
      if (count > 0 && count < preferredMin) thinPenalty += preferredMin - count;
    });

    const frontOverflowCount = unplacedFront.reduce((n, c) => n + c.size, 0);
    const score = violations.length * 10 + unplacedIds.length * 100 + frontOverflowCount * 5 + thinPenalty * 4;
    return {
      occupancy,
      score,
      unplacedIds,
      avoidViolations: violations,
      frontOverflowCount,
    };
  }

  // Main entry point: assigns students to seats for the given period's roster/layout.
  // Returns { assignment: {seatId: studentId}, unmet: {unplacedIds, avoidViolations, frontOverflowCount} }.
  function assignSeats(period) {
    const students = period.students;
    const layout = period.layout;
    const preferredMax = period.preferredPerTable || 4;
    const preferredMin = period.preferredMinPerTable || 1;

    if (!students.length || !layout.groups.length) {
      return { assignment: {}, unmet: { unplacedIds: students.map((s) => s.id), avoidViolations: [], frontOverflowCount: 0 } };
    }

    const ATTEMPTS = 120;
    let best = null;
    for (let i = 0; i < ATTEMPTS; i++) {
      const result = attempt(students, layout, period.avoidPairs, period.mustPairs, preferredMax, preferredMin);
      if (!best || result.score < best.score) best = result;
      if (best.score === 0) break;
    }

    // Convert group occupancy into concrete seat ids.
    const assignment = {};
    for (const g of layout.groups) {
      const occupants = best.occupancy[g.id] || [];
      occupants.forEach((studentId, i) => {
        assignment[seatId(g.id, i)] = studentId;
      });
    }

    return {
      assignment,
      unmet: {
        unplacedIds: best.unplacedIds,
        avoidViolations: best.avoidViolations,
        frontOverflowCount: best.frontOverflowCount,
      },
    };
  }

  App.seating = { seatId, groupCapacity, assignSeats };
})();

// Pointer-events-based drag-and-drop for swapping two seats. Works uniformly
// across mouse and touch (avoids HTML5 DnD's poor touch/Safari support).
(function () {
  function attach(container, onSwap) {
    let dragState = null;

    function clearDragOver() {
      container.querySelectorAll(".seat.drag-over").forEach((el) => el.classList.remove("drag-over"));
    }

    container.addEventListener("pointerdown", (e) => {
      const seatEl = e.target.closest(".seat");
      if (!seatEl || !seatEl.classList.contains("filled")) return;
      e.preventDefault();
      dragState = { fromId: seatEl.dataset.seatId, seatEl };
      try { seatEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      seatEl.classList.add("dragging");
    });

    container.addEventListener("pointermove", (e) => {
      if (!dragState) return;
      const target = document.elementFromPoint(e.clientX, e.clientY);
      const seatEl = target && target.closest && target.closest(".seat");
      clearDragOver();
      if (seatEl && seatEl !== dragState.seatEl) seatEl.classList.add("drag-over");
    });

    function finish(e) {
      if (!dragState) return;
      const target = document.elementFromPoint(e.clientX, e.clientY);
      const seatEl = target && target.closest && target.closest(".seat");
      clearDragOver();
      dragState.seatEl.classList.remove("dragging");
      if (seatEl && seatEl !== dragState.seatEl && seatEl.dataset.seatId) {
        onSwap(dragState.fromId, seatEl.dataset.seatId);
      }
      dragState = null;
    }

    container.addEventListener("pointerup", finish);
    container.addEventListener("pointercancel", () => {
      if (dragState) dragState.seatEl.classList.remove("dragging");
      dragState = null;
      clearDragOver();
    });
  }

  App.dnd = { attach };
})();

// ---- js/ui/roster.js ----
window.App = window.App || {};
App.ui = App.ui || {};

(function () {
  const { el, fullName } = App.util;
  let selectedIds = new Set();
  let lastPeriodId = null;

  const XLSX_CDN_URL = "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js";
  let xlsxLoadPromise = null;
  // Lazy-loads the Excel reader only when someone actually uploads an .xlsx/.xls
  // file, so the app has no external dependency until that feature is used.
  function ensureXLSX() {
    if (typeof XLSX !== "undefined") return Promise.resolve();
    if (xlsxLoadPromise) return xlsxLoadPromise;
    xlsxLoadPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = XLSX_CDN_URL;
      script.onload = () => resolve();
      script.onerror = () => {
        xlsxLoadPromise = null;
        reject(new Error("Couldn't load the Excel reader — check your internet connection and try again."));
      };
      document.head.appendChild(script);
    });
    return xlsxLoadPromise;
  }

  function toggleSelect(id) {
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
  }

  function getSelected() {
    return Array.from(selectedIds);
  }

  function clearSelected() {
    selectedIds.clear();
  }

  function render(period) {
    if (period.id !== lastPeriodId) {
      selectedIds.clear();
      lastPeriodId = period.id;
    }

    const panel = el("div", { class: "panel" });
    panel.appendChild(el("div", { class: "section-title", text: "Roster — " + period.students.length + " students" }));

    function addParsedStudents(parsed) {
      if (!parsed.length) {
        alert("No students found in that file.");
        return;
      }
      App.store.update((state) => {
        const p = state.periods[period.id];
        const existing = new Set(p.students.map((s) => (s.firstName + "|" + s.lastName).toLowerCase()));
        parsed.forEach((s) => {
          const key = (s.firstName + "|" + s.lastName).toLowerCase();
          if (existing.has(key)) return;
          existing.add(key);
          p.students.push({ id: App.store.uid("student"), firstName: s.firstName, lastName: s.lastName, front: false, phoneNumber: "" });
        });
      });
    }

    const fileInput = el("input", { type: "file", accept: ".csv,.txt,.xlsx,.xls,text/csv,text/plain", style: "display:none" });
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const name = file.name.toLowerCase();

      if (name.endsWith(".xlsx") || name.endsWith(".xls")) {
        ensureXLSX()
          .then(() => {
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const workbook = XLSX.read(new Uint8Array(reader.result), { type: "array" });
                addParsedStudents(App.csv.parseWorkbookRoster(workbook));
              } catch (err) {
                alert("Couldn't read that Excel file: " + err.message);
              }
            };
            reader.readAsArrayBuffer(file);
          })
          .catch((err) => alert(err.message));
      } else if (name.endsWith(".txt")) {
        const reader = new FileReader();
        reader.onload = () => addParsedStudents(App.csv.parseTextRoster(String(reader.result)));
        reader.readAsText(file);
      } else {
        const reader = new FileReader();
        reader.onload = () => addParsedStudents(App.csv.parseRoster(String(reader.result)));
        reader.readAsText(file);
      }
      e.target.value = "";
    });

    const toolbar = el("div", { class: "toolbar-row" }, [
      el("button", { text: "Upload Roster", onclick: () => fileInput.click() }),
      fileInput,
    ]);
    panel.appendChild(toolbar);
    panel.appendChild(el("div", { class: "hint", text: "CSV, Excel (.xlsx/.xls), or a plain text file with one name per line. Excel needs an internet connection the first time." }));

    const firstInput = el("input", { type: "text", placeholder: "First name" });
    const lastInput = el("input", { type: "text", placeholder: "Last name" });
    const addStudent = () => {
      const firstName = firstInput.value.trim();
      const lastName = lastInput.value.trim();
      if (!firstName && !lastName) return;
      App.store.update((state) => {
        state.periods[period.id].students.push({ id: App.store.uid("student"), firstName, lastName, front: false, phoneNumber: "" });
      });
    };
    firstInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addStudent(); });
    lastInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addStudent(); });
    panel.appendChild(el("div", { class: "toolbar-row" }, [
      firstInput,
      lastInput,
      el("button", { text: "Add", onclick: addStudent }),
    ]));

    const autoPhoneToggle = el("label", { class: "checkbox-row" }, [
      el("input", {
        type: "checkbox",
        checked: !!period.autoAssignPhoneNumbers,
        onchange: () => App.store.update((state) => {
          state.periods[period.id].autoAssignPhoneNumbers = !state.periods[period.id].autoAssignPhoneNumbers;
        }),
      }),
      "Auto-assign phone hotel #s by table (Table 1 = #1, 2, 3…, Table 2 continues from there, etc.)",
    ]);
    panel.appendChild(autoPhoneToggle);
    if (period.autoAssignPhoneNumbers) {
      panel.appendChild(el("div", { class: "hint", text: "Numbers are shown on the seating chart based on each seat's table. Manual numbers below are ignored while this is on." }));
    }

    if (selectedIds.size >= 2) {
      panel.appendChild(el("div", { class: "hint", text: selectedIds.size + " selected — use the Constraints panel below to pair them." }));
    } else {
      panel.appendChild(el("div", { class: "hint", text: "Check two or more students to create a must-sit or avoid-sit pair." }));
    }

    if (!period.students.length) {
      panel.appendChild(el("div", { class: "empty-state", text: "No students yet. Upload a roster or add students above." }));
      return panel;
    }

    const list = el("div", { class: "roster-list" });
    period.students
      .slice()
      .sort((a, b) => fullName(a).localeCompare(fullName(b)))
      .forEach((s) => {
        const checkbox = el("input", {
          type: "checkbox",
          checked: selectedIds.has(s.id),
          onchange: () => { toggleSelect(s.id); App.rerender(); },
        });

        const phoneInput = el("input", {
          type: "text",
          class: "phone-input",
          placeholder: "#",
          title: "Phone hotel number",
          value: s.phoneNumber || "",
          disabled: !!period.autoAssignPhoneNumbers,
        });
        phoneInput.addEventListener("change", () => {
          App.store.update((state) => {
            const stu = state.periods[period.id].students.find((x) => x.id === s.id);
            stu.phoneNumber = phoneInput.value.trim();
          });
        });

        const frontBtn = el("button", {
          class: "small" + (s.front ? " front-badge" : ""),
          text: "Front",
          style: s.front ? "border:none;" : undefined,
          onclick: () => {
            App.store.update((state) => {
              const stu = state.periods[period.id].students.find((x) => x.id === s.id);
              stu.front = !stu.front;
            });
          },
        });

        const deleteBtn = el("button", {
          class: "small danger row-delete",
          text: "✕",
          onclick: () => {
            App.store.update((state) => {
              const p = state.periods[period.id];
              p.students = p.students.filter((x) => x.id !== s.id);
              p.avoidPairs = p.avoidPairs.filter(([a, b]) => a !== s.id && b !== s.id);
              p.mustPairs = p.mustPairs.filter(([a, b]) => a !== s.id && b !== s.id);
              Object.keys(p.assignment).forEach((seat) => {
                if (p.assignment[seat] === s.id) delete p.assignment[seat];
              });
            });
          },
        });

        const row = el("div", { class: "roster-row" + (selectedIds.has(s.id) ? " selected" : "") }, [
          checkbox,
          el("span", { class: "name", text: fullName(s) || "(unnamed)" }),
          phoneInput,
          frontBtn,
          deleteBtn,
        ]);
        list.appendChild(row);
      });
    panel.appendChild(list);

    return panel;
  }

  App.ui.roster = { render, getSelected, clearSelected };
})();

// ---- js/ui/constraints.js ----
window.App = window.App || {};
App.ui = App.ui || {};

(function () {
  const { el, fullName } = App.util;

  function pairExists(list, a, b) {
    return list.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
  }

  function addMustGroup(periodId, ids) {
    App.store.update((state) => {
      const p = state.periods[periodId];
      for (let i = 1; i < ids.length; i++) {
        if (!pairExists(p.mustPairs, ids[0], ids[i])) p.mustPairs.push([ids[0], ids[i]]);
      }
    });
  }

  function addAvoidGroup(periodId, ids) {
    App.store.update((state) => {
      const p = state.periods[periodId];
      for (let i = 0; i < ids.length; i++) {
        for (let j = i + 1; j < ids.length; j++) {
          if (!pairExists(p.avoidPairs, ids[i], ids[j])) p.avoidPairs.push([ids[i], ids[j]]);
        }
      }
    });
  }

  function nameFor(period, id) {
    const s = period.students.find((x) => x.id === id);
    return s ? fullName(s) : "(removed student)";
  }

  function render(period) {
    const panel = el("div", { class: "panel" });
    panel.appendChild(el("div", { class: "section-title", text: "Seating Constraints" }));

    const selected = App.ui.roster.getSelected();
    const canCreate = selected.length >= 2;
    panel.appendChild(el("div", { class: "toolbar-row" }, [
      el("button", {
        text: "Must sit together",
        disabled: !canCreate,
        onclick: () => { addMustGroup(period.id, selected); App.ui.roster.clearSelected(); },
      }),
      el("button", {
        text: "Keep apart",
        disabled: !canCreate,
        onclick: () => { addAvoidGroup(period.id, selected); App.ui.roster.clearSelected(); },
      }),
    ]));

    const list = el("div", { class: "constraint-list" });
    if (!period.mustPairs.length && !period.avoidPairs.length) {
      list.appendChild(el("div", { class: "empty-state", text: "No constraints yet." }));
    }
    period.mustPairs.forEach((pair, i) => {
      list.appendChild(el("div", { class: "constraint-chip must" }, [
        el("span", { text: "Together: " + nameFor(period, pair[0]) + " + " + nameFor(period, pair[1]) }),
        el("button", {
          class: "small",
          text: "✕",
          onclick: () => App.store.update((state) => {
            state.periods[period.id].mustPairs.splice(i, 1);
          }),
        }),
      ]));
    });
    period.avoidPairs.forEach((pair, i) => {
      list.appendChild(el("div", { class: "constraint-chip avoid" }, [
        el("span", { text: "Apart: " + nameFor(period, pair[0]) + " + " + nameFor(period, pair[1]) }),
        el("button", {
          class: "small",
          text: "✕",
          onclick: () => App.store.update((state) => {
            state.periods[period.id].avoidPairs.splice(i, 1);
          }),
        }),
      ]));
    });
    panel.appendChild(list);

    return panel;
  }

  App.ui.constraints = { render };
})();

// ---- js/ui/layout.js ----
window.App = window.App || {};
App.ui = App.ui || {};

(function () {
  const { el } = App.util;

  function mutateLayout(periodId, fn) {
    App.store.update((state) => {
      const p = state.periods[periodId];
      fn(p.layout);
      p.assignment = {}; // seat ids are layout-dependent; a layout change invalidates the current chart
    });
  }

  function render(period) {
    const panel = el("div", { class: "panel layout-panel" });
    panel.appendChild(el("div", { class: "section-title", text: "Classroom Layout" }));

    const layout = period.layout;

    const rowsInput = el("input", { type: "number", min: 0, max: 10, value: layout.rows });
    const colsInput = el("input", { type: "number", min: 0, max: 10, value: layout.cols });
    const maxInput = el("input", { type: "number", min: 1, max: 16, value: period.preferredPerTable });
    const minInput = el("input", { type: "number", min: 1, max: 16, value: period.preferredMinPerTable });

    rowsInput.addEventListener("change", () => {
      const rows = Math.max(0, Math.min(10, parseInt(rowsInput.value, 10) || 0));
      mutateLayout(period.id, (l) => {
        l.rows = rows;
        l.groups = l.groups.filter((g) => g.row < rows);
      });
    });
    colsInput.addEventListener("change", () => {
      const cols = Math.max(0, Math.min(10, parseInt(colsInput.value, 10) || 0));
      mutateLayout(period.id, (l) => {
        l.cols = cols;
        l.groups = l.groups.filter((g) => g.col < cols);
      });
    });
    maxInput.addEventListener("change", () => {
      const val = Math.max(1, Math.min(16, parseInt(maxInput.value, 10) || 1));
      App.store.update((state) => {
        const p = state.periods[period.id];
        p.preferredPerTable = val;
        if (p.preferredMinPerTable > val) p.preferredMinPerTable = val;
      });
    });
    minInput.addEventListener("change", () => {
      const val = Math.max(1, Math.min(16, parseInt(minInput.value, 10) || 1));
      App.store.update((state) => {
        const p = state.periods[period.id];
        p.preferredMinPerTable = Math.min(val, p.preferredPerTable);
      });
    });

    panel.appendChild(el("div", { class: "layout-config-row" }, [
      el("div", { class: "field" }, [el("label", { text: "Rows" }), rowsInput]),
      el("div", { class: "field" }, [el("label", { text: "Columns" }), colsInput]),
      el("div", { class: "field" }, [el("label", { text: "Preferred max / table" }), maxInput]),
      el("div", { class: "field" }, [el("label", { text: "Preferred min / table" }), minInput]),
    ]));

    panel.appendChild(el("div", { class: "section-title", style: "margin-top:16px;", text: "Seat Suits" }));
    panel.appendChild(el("div", { class: "hint", text: "Applied to every table by seat position, in reading order (top-left, top-right, bottom-left, bottom-right for a 2×2 table). The pattern repeats for tables larger than 4 seats." }));
    const suitLabels = ["Seat 1", "Seat 2", "Seat 3", "Seat 4"];
    const suitRow = el("div", { class: "layout-config-row" });
    period.suitPattern.forEach((suitKey, idx) => {
      const select = el("select", {}, Object.keys(App.util.SUITS).map((key) =>
        el("option", { value: key, text: App.util.SUITS[key].symbol + " " + App.util.SUITS[key].label, selected: key === suitKey })
      ));
      select.addEventListener("change", () => {
        App.store.update((state) => {
          state.periods[period.id].suitPattern[idx] = select.value;
        });
      });
      suitRow.appendChild(el("div", { class: "field" }, [el("label", { text: suitLabels[idx] }), select]));
    });
    panel.appendChild(suitRow);

    if (!layout.rows || !layout.cols) {
      panel.appendChild(el("div", { class: "empty-state", text: "Set rows and columns above, then click a cell to place a table group." }));
      return panel;
    }

    const tableNumbers = App.util.numberTables(layout);
    const grid = el("div", {
      class: "room-grid",
      style: `grid-template-columns: repeat(${layout.cols}, minmax(140px, 1fr)); grid-template-rows: repeat(${layout.rows}, auto);`,
    });

    for (let r = 0; r < layout.rows; r++) {
      for (let c = 0; c < layout.cols; c++) {
        const group = layout.groups.find((g) => g.row === r && g.col === c);
        if (!group) {
          grid.appendChild(el("div", {
            class: "table-group empty-slot",
            text: "+ Add table",
            onclick: () => mutateLayout(period.id, (l) => {
              l.groups.push({ id: App.store.uid("group"), row: r, col: c, seatRows: 2, seatCols: 2, isFront: r === 0 });
            }),
          }));
          continue;
        }

        const seatRowsInput = el("input", { type: "number", min: 1, max: 6, value: group.seatRows });
        seatRowsInput.addEventListener("change", () => {
          const val = Math.max(1, Math.min(6, parseInt(seatRowsInput.value, 10) || 1));
          mutateLayout(period.id, (l) => {
            l.groups.find((g) => g.id === group.id).seatRows = val;
          });
        });
        const seatColsInput = el("input", { type: "number", min: 1, max: 6, value: group.seatCols });
        seatColsInput.addEventListener("change", () => {
          const val = Math.max(1, Math.min(6, parseInt(seatColsInput.value, 10) || 1));
          mutateLayout(period.id, (l) => {
            l.groups.find((g) => g.id === group.id).seatCols = val;
          });
        });

        const frontToggle = el("label", { class: "checkbox-row" }, [
          el("input", {
            type: "checkbox",
            checked: group.isFront,
            onchange: () => mutateLayout(period.id, (l) => {
              l.groups.find((g) => g.id === group.id).isFront = !l.groups.find((g) => g.id === group.id).isFront;
            }),
          }),
          "Front",
        ]);

        const removeBtn = el("button", {
          class: "small danger",
          text: "✕",
          onclick: () => mutateLayout(period.id, (l) => {
            l.groups = l.groups.filter((g) => g.id !== group.id);
          }),
        });

        grid.appendChild(el("div", { class: "table-group" + (group.isFront ? " front" : "") }, [
          el("div", { class: "table-header" }, [
            el("span", { text: "Table " + tableNumbers[group.id], class: group.isFront ? "front-tag" : "" }),
            removeBtn,
          ]),
          el("div", { class: "table-controls" }, [
            el("span", { text: "Seats:" }),
            seatRowsInput,
            el("span", { text: "×" }),
            seatColsInput,
            frontToggle,
          ]),
        ]));
      }
    }

    panel.appendChild(grid);
    return panel;
  }

  App.ui.layout = { render };
})();

// ---- js/ui/chart.js ----
window.App = window.App || {};
App.ui = App.ui || {};

(function () {
  const { el, fullName } = App.util;
  const lastUnmetByPeriod = {};

  function computeConflicts(period) {
    const conflictSeats = new Set();
    const seatOf = {}; // studentId -> {sid, groupId}
    period.layout.groups.forEach((g) => {
      const capacity = App.seating.groupCapacity(g);
      const occupied = [];
      for (let i = 0; i < capacity; i++) {
        const sid = App.seating.seatId(g.id, i);
        const studentId = period.assignment[sid];
        if (studentId) {
          occupied.push({ sid, studentId });
          seatOf[studentId] = { sid, groupId: g.id };
        }
      }
      for (let i = 0; i < occupied.length; i++) {
        for (let j = i + 1; j < occupied.length; j++) {
          const a = occupied[i], b = occupied[j];
          const conflict = period.avoidPairs.some(([x, y]) =>
            (x === a.studentId && y === b.studentId) || (x === b.studentId && y === a.studentId)
          );
          if (conflict) { conflictSeats.add(a.sid); conflictSeats.add(b.sid); }
        }
      }
    });
    // "Must sit together" pairs that ended up at different tables are conflicts too.
    period.mustPairs.forEach(([a, b]) => {
      const seatA = seatOf[a], seatB = seatOf[b];
      if (seatA && seatB && seatA.groupId !== seatB.groupId) {
        conflictSeats.add(seatA.sid);
        conflictSeats.add(seatB.sid);
      }
    });
    return conflictSeats;
  }

  // Live (recomputed every render, so it stays correct after manual drags too) —
  // tables with a nonzero headcount that's still below the preferred minimum.
  function computeThinGroups(period) {
    const thin = new Set();
    const min = period.preferredMinPerTable || 1;
    period.layout.groups.forEach((g) => {
      const capacity = App.seating.groupCapacity(g);
      let count = 0;
      for (let i = 0; i < capacity; i++) {
        if (period.assignment[App.seating.seatId(g.id, i)]) count++;
      }
      if (count > 0 && count < min) thin.add(g.id);
    });
    return thin;
  }

  function swapSeats(periodId, fromId, toId) {
    App.store.update((state) => {
      const p = state.periods[periodId];
      const a = p.assignment[fromId];
      const b = p.assignment[toId];
      if (b === undefined) delete p.assignment[fromId]; else p.assignment[fromId] = b;
      if (a === undefined) delete p.assignment[toId]; else p.assignment[toId] = a;
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function wrapText(ctx, text, cx, cy, maxWidth, lineHeight) {
    const words = text.split(" ");
    const lines = [];
    let current = "";
    words.forEach((w) => {
      const test = current ? current + " " + w : w;
      if (current && ctx.measureText(test).width > maxWidth) {
        lines.push(current);
        current = w;
      } else {
        current = test;
      }
    });
    if (current) lines.push(current);
    const startY = cy - ((lines.length - 1) * lineHeight) / 2;
    lines.forEach((line, i) => ctx.fillText(line, cx, startY + i * lineHeight));
  }

  const FONT = "-apple-system, Helvetica, Arial, sans-serif";

  // Draws the seating chart fresh onto a canvas (not a DOM screenshot), so the
  // exported image follows the same "clean" rules as print: no conflict/thin
  // highlighting, no "Front" word — just the room, tables, and students.
  function buildChartCanvas(period) {
    const SCALE = 2;
    const SEAT_W = 130, SEAT_H = 66, SEAT_GAP = 8;
    const TABLE_PAD = 14, HEADER_H = 26, TABLE_GAP = 26, MARGIN = 36, BANNER_H = 96;

    const layout = period.layout;
    const groups = layout.groups;
    const maxSeatCols = Math.max(1, ...groups.map((g) => g.seatCols));
    const maxSeatRows = Math.max(1, ...groups.map((g) => g.seatRows));
    const cellW = TABLE_PAD * 2 + maxSeatCols * SEAT_W + (maxSeatCols - 1) * SEAT_GAP;
    const cellH = HEADER_H + TABLE_PAD * 2 + maxSeatRows * SEAT_H + (maxSeatRows - 1) * SEAT_GAP;

    const width = MARGIN * 2 + layout.cols * cellW + Math.max(0, layout.cols - 1) * TABLE_GAP;
    const height = MARGIN * 2 + BANNER_H + layout.rows * cellH + Math.max(0, layout.rows - 1) * TABLE_GAP;

    const canvas = document.createElement("canvas");
    canvas.width = Math.round(width * SCALE);
    canvas.height = Math.round(height * SCALE);
    const ctx = canvas.getContext("2d");
    ctx.scale(SCALE, SCALE);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, width, height);

    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#000000";
    ctx.font = "800 30px " + FONT;
    ctx.fillText("Whiteboard / Front of Class", width / 2, MARGIN + 30);
    ctx.beginPath();
    ctx.moveTo(MARGIN, MARGIN + 44);
    ctx.lineTo(width - MARGIN, MARGIN + 44);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#000000";
    ctx.stroke();
    ctx.font = "700 20px " + FONT;
    ctx.fillText(period.label, width / 2, MARGIN + 74);

    const tableNumbers = App.util.numberTables(layout);
    const autoPhoneNumbers = period.autoAssignPhoneNumbers ? App.util.computeAutoPhoneNumbers(layout) : null;

    groups.forEach((g) => {
      const x = MARGIN + g.col * (cellW + TABLE_GAP);
      const y = MARGIN + BANNER_H + g.row * (cellH + TABLE_GAP);
      const tableW = TABLE_PAD * 2 + g.seatCols * SEAT_W + (g.seatCols - 1) * SEAT_GAP;
      const tableH = HEADER_H + TABLE_PAD * 2 + g.seatRows * SEAT_H + (g.seatRows - 1) * SEAT_GAP;

      ctx.strokeStyle = g.isFront ? "#b5750a" : "#000000";
      ctx.lineWidth = 2;
      roundRect(ctx, x, y, tableW, tableH, 10);
      ctx.stroke();

      ctx.textAlign = "left";
      ctx.fillStyle = g.isFront ? "#b5750a" : "#000000";
      ctx.font = "700 14px " + FONT;
      ctx.fillText("Table " + tableNumbers[g.id], x + TABLE_PAD, y + 20);

      const capacity = App.seating.groupCapacity(g);
      for (let i = 0; i < capacity; i++) {
        const sr = Math.floor(i / g.seatCols);
        const sc = i % g.seatCols;
        const sx = x + TABLE_PAD + sc * (SEAT_W + SEAT_GAP);
        const sy = y + HEADER_H + TABLE_PAD + sr * (SEAT_H + SEAT_GAP);

        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#999999";
        ctx.lineWidth = 1.5;
        roundRect(ctx, sx, sy, SEAT_W, SEAT_H, 6);
        ctx.fill();
        ctx.stroke();

        const sid = App.seating.seatId(g.id, i);
        const studentId = period.assignment[sid];
        const student = studentId ? period.students.find((s) => s.id === studentId) : null;
        const suitKey = App.util.suitForSeatIndex(period, i);
        const suit = App.util.SUITS[suitKey];

        ctx.textAlign = "right";
        ctx.fillStyle = suit.color === "red" ? "#c0392b" : "#000000";
        ctx.font = "700 13px " + FONT;
        ctx.fillText(suit.symbol, sx + SEAT_W - 8, sy + 17);

        ctx.textAlign = "center";
        ctx.fillStyle = "#000000";
        ctx.font = "600 13px " + FONT;
        wrapText(ctx, student ? fullName(student) : "Empty", sx + SEAT_W / 2, sy + SEAT_H / 2 - 2, SEAT_W - 16, 15);

        const phoneLine = autoPhoneNumbers
          ? "#" + autoPhoneNumbers[sid]
          : (student && student.phoneNumber ? "#" + student.phoneNumber : null);
        if (phoneLine) {
          ctx.font = "400 11px " + FONT;
          ctx.fillStyle = "#555555";
          ctx.fillText(phoneLine, sx + SEAT_W / 2, sy + SEAT_H - 8);
        }
      }
    });

    return canvas;
  }

  function downloadChartImage(period) {
    const canvas = buildChartCanvas(period);
    canvas.toBlob((blob) => {
      if (!blob) { alert("Couldn't generate the image."); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = (period.label || "seating-chart").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") + "-seating-chart.jpg";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }, "image/jpeg", 0.92);
  }

  function render(period) {
    const panel = el("div", { class: "panel seating-chart-panel" });
    panel.appendChild(el("div", { class: "section-title", text: "Seating Chart" }));

    const hasSeats = period.layout.groups.length > 0;
    const hasStudents = period.students.length > 0;

    panel.appendChild(el("div", { class: "toolbar-row" }, [
      el("button", {
        class: "primary",
        text: "Randomize",
        disabled: !hasSeats || !hasStudents,
        onclick: () => {
          App.store.update((state) => {
            const p = state.periods[period.id];
            const result = App.seating.assignSeats(p);
            p.assignment = result.assignment;
            lastUnmetByPeriod[period.id] = result.unmet;
          });
        },
      }),
      el("button", {
        text: "Clear seats",
        disabled: !Object.keys(period.assignment).length,
        onclick: () => {
          delete lastUnmetByPeriod[period.id];
          App.store.update((state) => { state.periods[period.id].assignment = {}; });
        },
      }),
      el("button", {
        text: "Print",
        disabled: !Object.keys(period.assignment).length,
        onclick: () => window.print(),
      }),
      el("button", {
        text: "Save as Image (JPG)",
        disabled: !Object.keys(period.assignment).length,
        onclick: () => downloadChartImage(period),
      }),
    ]));

    const unmet = lastUnmetByPeriod[period.id];
    if (unmet && (unmet.unplacedIds.length || unmet.avoidViolations.length || unmet.frontOverflowCount)) {
      const lines = [];
      if (unmet.unplacedIds.length) lines.push(unmet.unplacedIds.length + " student(s) couldn't be seated — add more tables or seats.");
      if (unmet.frontOverflowCount) lines.push(unmet.frontOverflowCount + " front-priority student(s) didn't fit in the front seats.");
      if (unmet.avoidViolations.length) lines.push(unmet.avoidViolations.length + " \"keep apart\" pair(s) ended up at the same table.");
      panel.appendChild(el("div", { class: "warning-banner", text: lines.join(" ") }));
    }

    if (!hasSeats) {
      panel.appendChild(el("div", { class: "empty-state", text: "Design a classroom layout below to see the seating chart." }));
      return panel;
    }
    if (!hasStudents) {
      panel.appendChild(el("div", { class: "empty-state", text: "Add students to the roster to start seating them." }));
      return panel;
    }

    panel.appendChild(el("div", { class: "print-header" }, [
      el("div", { class: "print-header-banner", text: "Whiteboard / Front of Class" }),
      el("div", { class: "print-header-sub", text: period.label }),
    ]));

    const conflicts = computeConflicts(period);
    const thinGroups = computeThinGroups(period);
    const tableNumbers = App.util.numberTables(period.layout);
    const autoPhoneNumbers = period.autoAssignPhoneNumbers ? App.util.computeAutoPhoneNumbers(period.layout) : null;
    const layout = period.layout;
    const grid = el("div", {
      class: "room-grid",
      style: `grid-template-columns: repeat(${layout.cols}, minmax(140px, 1fr)); grid-template-rows: repeat(${layout.rows}, auto);`,
    });

    for (let r = 0; r < layout.rows; r++) {
      for (let c = 0; c < layout.cols; c++) {
        const group = layout.groups.find((g) => g.row === r && g.col === c);
        if (!group) {
          grid.appendChild(el("div", { class: "table-group blank" }));
          continue;
        }
        const capacity = App.seating.groupCapacity(group);
        const seatGrid = el("div", {
          class: "seat-grid",
          style: `grid-template-columns: repeat(${group.seatCols}, 1fr);`,
        });
        for (let i = 0; i < capacity; i++) {
          const sid = App.seating.seatId(group.id, i);
          const studentId = period.assignment[sid];
          const student = studentId ? period.students.find((s) => s.id === studentId) : null;
          const suitKey = App.util.suitForSeatIndex(period, i);
          const suit = App.util.SUITS[suitKey];
          const phoneLine = autoPhoneNumbers
            ? "#" + autoPhoneNumbers[sid]
            : (student && student.phoneNumber ? "#" + student.phoneNumber : null);
          const classes = ["seat"];
          if (student) classes.push("filled");
          if (conflicts.has(sid)) classes.push("conflict");
          seatGrid.appendChild(el("div", {
            class: classes.join(" "),
            "data-seat-id": sid,
          }, [
            el("span", { class: "suit-badge suit-" + suit.color, text: suit.symbol }),
            el("span", { class: "seat-name", text: student ? fullName(student) : "Empty" }),
            phoneLine ? el("span", { class: "seat-phone", text: phoneLine }) : null,
          ]));
        }
        const isThin = thinGroups.has(group.id);
        grid.appendChild(el("div", { class: "table-group" + (group.isFront ? " front" : "") + (isThin ? " thin" : "") }, [
          el("div", { class: "table-header" }, [
            el("span", { class: group.isFront ? "front-tag" : "" }, [
              group.isFront ? el("span", { class: "front-word", text: "Front " }) : null,
              "Table " + tableNumbers[group.id],
            ]),
            isThin ? el("span", { class: "thin-tag", text: "Below min" }) : null,
          ]),
          seatGrid,
        ]));
      }
    }

    panel.appendChild(grid);
    panel.appendChild(el("div", { class: "legend" }, [
      el("span", {}, [el("span", { class: "swatch", style: "background: var(--front-badge)" }), "Front table"]),
      el("span", {}, [el("span", { class: "swatch", style: "background: var(--danger)" }), "Seating rule broken (keep-apart or must-sit-together)"]),
      el("span", {}, [el("span", { class: "swatch", style: "background: var(--warning)" }), "Below preferred minimum per table"]),
      el("span", {}, ["Drag a seated student onto another seat to swap them."]),
    ]));

    App.dnd.attach(grid, (fromId, toId) => swapSeats(period.id, fromId, toId));

    return panel;
  }

  App.ui.chart = { render, clearWarning: (periodId) => { delete lastUnmetByPeriod[periodId]; } };
})();

window.App = window.App || {};
App.ui = App.ui || {};

(function () {
  const { el, formatTimestamp } = App.util;

  function render(period) {
    const panel = el("div", { class: "panel" });
    panel.appendChild(el("div", { class: "section-title", text: "Saved Charts" }));

    const hasChart = Object.keys(period.assignment).length > 0;
    panel.appendChild(el("div", { class: "toolbar-row" }, [
      el("button", {
        class: "primary",
        text: "Save current chart",
        disabled: !hasChart,
        onclick: () => {
          const defaultName = "Chart — " + new Date().toLocaleDateString();
          const name = window.prompt("Name this seating chart:", defaultName);
          if (!name) return;
          App.store.update((state) => {
            const p = state.periods[period.id];
            const now = new Date().toISOString();
            p.savedCharts.push({
              id: App.store.uid("chart"),
              name,
              layout: JSON.parse(JSON.stringify(p.layout)),
              assignment: Object.assign({}, p.assignment),
              createdAt: now,
              lastUsedAt: now,
            });
          });
        },
      }),
    ]));

    if (!period.savedCharts.length) {
      panel.appendChild(el("div", { class: "empty-state", text: "No saved charts yet for this period." }));
      return panel;
    }

    period.savedCharts
      .slice()
      .sort((a, b) => new Date(b.lastUsedAt) - new Date(a.lastUsedAt))
      .forEach((chart) => {
        const row = el("div", { class: "saved-chart-row" });
        row.appendChild(el("div", { class: "name-row" }, [
          el("span", { text: chart.name }),
        ]));
        row.appendChild(el("div", {
          class: "timestamps",
          text: "Created " + formatTimestamp(chart.createdAt) + " · Last used " + formatTimestamp(chart.lastUsedAt),
        }));
        row.appendChild(el("div", { class: "actions" }, [
          el("button", {
            class: "small",
            text: "Load",
            onclick: () => {
              App.ui.chart.clearWarning(period.id);
              App.store.update((state) => {
                const p = state.periods[period.id];
                const saved = p.savedCharts.find((c) => c.id === chart.id);
                p.layout = JSON.parse(JSON.stringify(saved.layout));
                p.assignment = Object.assign({}, saved.assignment);
                saved.lastUsedAt = new Date().toISOString();
              });
            },
          }),
          el("button", {
            class: "small",
            text: "Rename",
            onclick: () => {
              const newName = window.prompt("Rename chart:", chart.name);
              if (!newName) return;
              App.store.update((state) => {
                const saved = state.periods[period.id].savedCharts.find((c) => c.id === chart.id);
                saved.name = newName;
              });
            },
          }),
          el("button", {
            class: "small danger",
            text: "Delete",
            onclick: () => {
              if (!window.confirm('Delete saved chart "' + chart.name + '"?')) return;
              App.store.update((state) => {
                const p = state.periods[period.id];
                p.savedCharts = p.savedCharts.filter((c) => c.id !== chart.id);
              });
            },
          }),
        ]));
        panel.appendChild(row);
      });

    return panel;
  }

  App.ui.savedCharts = { render };
})();

(function () {
  const { el } = App.util;

  function render() {
    const state = App.store.state;
    const period = App.store.getActivePeriod();
    const root = document.getElementById("app");
    root.innerHTML = "";

    root.appendChild(el("div", { class: "header-bar" }, [
      el("h1", { text: "Seating Chart" }),
    ]));
    root.appendChild(App.ui.periods.renderTabs(state));

    const mainGrid = el("div", { class: "main-grid" });

    const sidebar = el("div", { class: "sidebar sidebar-info" }, [
      App.ui.roster.render(period),
      App.ui.constraints.render(period),
      App.ui.savedCharts.render(period),
    ]);

    const centerCol = el("div", { class: "sidebar sidebar-room" }, [
      App.ui.layout.render(period),
      App.ui.chart.render(period),
    ]);

    mainGrid.appendChild(sidebar);
    mainGrid.appendChild(centerCol);
    root.appendChild(mainGrid);
  }

  App.rerender = render;
  App.store.subscribe(render);
  render();
})();
</script>
</body>
</html>
